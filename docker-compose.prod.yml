services:
  backend:
    image: ghcr.io/kore29/volta:latest
    pull_policy: always
    container_name: volta-backend
    restart: always
    volumes:
      - wwebjs-auth:/app/backend/.wwebjs_auth
      - /opt/docker/volta/.env:/app/.env:ro
    command: sh -c "cd /app/backend && npx prisma migrate deploy && pnpm --filter backend start"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: ghcr.io/kore29/volta:latest
    pull_policy: always
    container_name: volta-frontend
    restart: always
    depends_on:
      - backend
    volumes:
      - /opt/docker/volta/.env:/app/.env:ro
    command: pnpm --filter frontend start
    ports:
      - "${PORT_HOST:-3001}:${PORT:-3000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  wwebjs-auth:
