services:
  backend:
    image: ghcr.io/kore29/volta:latest
    container_name: volta-backend
    restart: always
    volumes:
      - wwebjs-auth:/app/backend/.wwebjs_auth
      - /opt/docker/volta/.env:/app/.env:ro
    command: npm run --workspace=backend start
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: ghcr.io/kore29/volta:latest
    container_name: volta-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - BACKEND_INTERNAL_URL=http://backend:3001
      - NODE_ENV=production
      - AUTH_TRUST_HOST=true
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - /opt/docker/volta/.env:/app/.env:ro
    command: npm run --workspace=frontend start
    ports:
      - "${PORT_HOST:-3001}:${PORT:-3000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  wwebjs-auth:
