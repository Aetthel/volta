services:
  backend:
    image: ghcr.io/aetthel/volta:latest
    pull_policy: always
    container_name: volta-backend
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - API_KEY=${API_KEY}
      - BACKEND_JWT_SECRET=${BACKEND_JWT_SECRET}
      - LOPD_HMAC_SECRET=${LOPD_HMAC_SECRET}
      - BOOKING_JWT_SECRET=${BOOKING_JWT_SECRET}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-Volta <onboarding@resend.dev>}
      - REDIS_URL=${REDIS_URL:-}
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_TLS=${REDIS_TLS:-}
      - NODE_ENV=production
      - LEMONSQUEEZY_API_KEY=${LEMONSQUEEZY_API_KEY:-}
      - LEMONSQUEEZY_STORE_ID=${LEMONSQUEEZY_STORE_ID:-}
      - LEMONSQUEEZY_WEBHOOK_SECRET=${LEMONSQUEEZY_WEBHOOK_SECRET:-}
      - LEMONSQUEEZY_VARIANT_BASIC=${LEMONSQUEEZY_VARIANT_BASIC:-}
      - LEMONSQUEEZY_VARIANT_PRO=${LEMONSQUEEZY_VARIANT_PRO:-}
    command: sh -c "cd /app/backend && npx prisma migrate deploy && pnpm --filter backend start"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 512M
    extra_hosts:
      - "host.docker.internal:host-gateway"

  evolution-api:
    image: evoapicloud/evolution-api:v2.2.3
    container_name: volta-evolution-api
    restart: always
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8080}
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR,WARN,INFO
      - LOG_COLOR=true
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      - CORS_CREDENTIALS=true
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=${DATABASE_URL}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_exchange
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=${REDIS_URL:-redis://redis:6379/1}
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=true
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=${BACKEND_INTERNAL_URL:-http://backend:3001}/api/webhooks/whatsapp
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_CONTACTS_UPDATE=false
      - WEBHOOK_EVENTS_CHATS_UPDATE=false
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=false
    volumes:
      - evolution_instances:/evolution/instances
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    image: ghcr.io/aetthel/volta:latest
    pull_policy: always
    container_name: volta-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - API_KEY=${API_KEY}
      - BACKEND_JWT_SECRET=${BACKEND_JWT_SECRET}
      - LOPD_HMAC_SECRET=${LOPD_HMAC_SECRET}
      - BOOKING_JWT_SECRET=${BOOKING_JWT_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://volta.kore29.com}
      - AUTH_URL=${FRONTEND_URL}
      - BACKEND_INTERNAL_URL=http://backend:3001
      - AUTH_TRUST_HOST=true
      - NODE_ENV=production
    command: pnpm --filter frontend start
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    ports:
      - "${PORT_HOST:-3001}:${PORT:-3000}"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          memory: 256M
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  evolution_instances:
