services:
  backend:
    image: ghcr.io/kore29/volta:latest
    pull_policy: always
    container_name: volta-backend
    restart: always
    volumes:
      - wwebjs-auth:/app/backend/.wwebjs_auth
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - API_KEY=${API_KEY}
      - BACKEND_JWT_SECRET=${BACKEND_JWT_SECRET}
      - LOPD_HMAC_SECRET=${LOPD_HMAC_SECRET}
      - NODE_ENV=production
    command: sh -c "cd /app/backend && npx prisma migrate deploy && pnpm --filter backend start"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: ghcr.io/kore29/volta:latest
    pull_policy: always
    container_name: volta-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - API_KEY=${API_KEY}
      - BACKEND_JWT_SECRET=${BACKEND_JWT_SECRET}
      - LOPD_HMAC_SECRET=${LOPD_HMAC_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://volta.kore29.com}
      - AUTH_URL=${FRONTEND_URL}
      - BACKEND_INTERNAL_URL=http://backend:3001
      - AUTH_TRUST_HOST=true
      - NODE_ENV=production
    command: pnpm --filter frontend start
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    ports:
      - "${PORT_HOST:-3001}:${PORT:-3000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  wwebjs-auth:
