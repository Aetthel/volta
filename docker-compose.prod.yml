services:
  backend:
    image: ghcr.io/kore29/volta:latest
    container_name: volta-backend
    restart: always
    env_file:
      - .env.prod
    environment:
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - wwebjs-auth:/app/backend/.wwebjs_auth
    command: npm run --workspace=backend start
    # Connect to the host's existing PostgreSQL via extra_hosts
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: ghcr.io/kore29/volta:latest
    container_name: volta-frontend
    restart: always
    depends_on:
      - backend
    env_file:
      - .env.prod
    environment:
      - BACKEND_INTERNAL_URL=http://backend:3001
      - NODE_ENV=production
      - AUTH_TRUST_HOST=true
    ports:
      - "127.0.0.1:3000:3000"
    command: npm run --workspace=frontend start
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: volta-cloudflared
    restart: always
    depends_on:
      - frontend
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run

volumes:
  wwebjs-auth:
