services:
  backend:
    image: ghcr.io/kore29/volta:latest
    container_name: volta-backend
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - wwebjs-auth:/app/backend/.wwebjs_auth
    command: npm run --workspace=backend start
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: ghcr.io/kore29/volta:latest
    container_name: volta-frontend
    restart: always
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      - BACKEND_INTERNAL_URL=http://backend:3001
      - NODE_ENV=production
      - AUTH_TRUST_HOST=true
      - PORT=3000
      - HOSTNAME=0.0.0.0
    command: npm run --workspace=frontend start
    ports:
      - "${PORT_HOST:-3001}:${PORT:-3000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - cloudfare-tunnel_default

  watchtower:
    image: containrrr/watchtower:latest
    container_name: volta-watchtower
    restart: always
    environment:
      - DOCKER_API_VERSION=1.40
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json
    command: --cleanup --interval 300 volta-frontend volta-backend

volumes:
  wwebjs-auth:

networks:
  cloudfare-tunnel_default:
    external: true
