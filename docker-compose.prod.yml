services:
  db:
    image: postgres:15
    container_name: volta-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No ports exposed — DB is only accessible within Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/kore29/volta:latest
    container_name: volta-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - wwebjs-auth:/app/backend/.wwebjs_auth
    command: npm run --workspace=backend start

  frontend:
    image: ghcr.io/kore29/volta:latest
    container_name: volta-frontend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - BACKEND_INTERNAL_URL=http://backend:3001
      - NODE_ENV=production
      - AUTH_TRUST_HOST=true
    ports:
      - "127.0.0.1:3000:3000"
    command: npm run --workspace=frontend start

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: volta-cloudflared
    restart: always
    depends_on:
      - frontend
    volumes:
      - ./cloudflared:/etc/cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run

volumes:
  postgres_data:
  wwebjs-auth:
