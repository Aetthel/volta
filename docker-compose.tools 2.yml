services:
  # =============================================================================
  # 1. Adminer: Visualizador web ligero (PostgreSQL, Redis, MySQL, SQLite)
  # Acceso: http://localhost:8080
  # =============================================================================
  adminer:
    image: adminer:latest
    container_name: volta-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - default

  # =============================================================================
  # 2. CloudBeaver: Interfaz web avanzada estilo DBeaver (PostgreSQL, Redis, etc.)
  # Acceso: http://localhost:8978
  # =============================================================================
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: volta-cloudbeaver
    restart: unless-stopped
    ports:
      - "${CLOUDBEAVER_PORT:-8978}:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    networks:
      - default

  # =============================================================================
  # 3. RedisInsight: Visualizador oficial web para Redis
  # Acceso: http://localhost:5540
  # =============================================================================
  redisinsight:
    image: redis/redisinsight:latest
    container_name: volta-redisinsight
    restart: unless-stopped
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/db
    networks:
      - default

networks:
  default:
    name: volta_default
    external: true

volumes:
  cloudbeaver_data:
  redisinsight_data:
