services:
  db:
    image: postgres:15
    container_name: volta-db
    restart: no
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-volta_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volta_password}
      POSTGRES_DB: ${POSTGRES_DB:-volta_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-volta_user} -d ${POSTGRES_DB:-volta_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: volta-backend
    restart: no
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - CI=true
      - PNPM_CONFIG_STORE_DIR=/home/volta/.local/share/pnpm/store
      - DATABASE_URL=postgresql://volta_user:volta_password@db:5432/volta_db?schema=public
      - PORT=3001
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/backend/node_modules
      - wwebjs-auth:/app/backend/.wwebjs_auth
    ports:
      - "3001:3001"
    command: sh -c "pnpm install && cd /app/backend && npx prisma migrate deploy && cd /app && pnpm --filter backend dev"

  frontend:
    build: .
    container_name: volta-frontend
    restart: no
    depends_on:
      - db
      - backend
    env_file:
      - .env
    environment:
      - CI=true
      - PNPM_CONFIG_STORE_DIR=/home/volta/.local/share/pnpm/store
      - DATABASE_URL=postgresql://volta_user:volta_password@db:5432/volta_db?schema=public
      - BACKEND_INTERNAL_URL=http://backend:3001
      # AUTH_TRUST_HOST tells NextAuth (Auth.js v5) to trust the X-Forwarded-Host
      # header set by Cloudflare Tunnel / any reverse proxy, avoiding redirect loops.
      - AUTH_TRUST_HOST=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/backend/node_modules
      - /app/frontend/.next
    ports:
      - "3000:3000"
    command: sh -c "pnpm install && pnpm --filter frontend dev"

volumes:
  postgres_data:
  wwebjs-auth:
