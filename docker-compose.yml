services:
  db:
    image: postgres:15-alpine
    container_name: volta-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-volta_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volta_password}
      POSTGRES_DB: ${POSTGRES_DB:-volta_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-volta_user} -d ${POSTGRES_DB:-volta_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: volta-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  backend:
    build:
      context: .
      target: dev
    container_name: volta-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - CI=true
      - PNPM_CONFIG_STORE_DIR=/home/volta/.local/share/pnpm/store
      - DATABASE_URL=postgresql://${POSTGRES_USER:-volta_user}:${POSTGRES_PASSWORD:-volta_password}@db:5432/${POSTGRES_DB:-volta_db}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - PORT=3001
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3001/health\").then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/backend/node_modules
      - wwebjs-auth:/app/backend/.wwebjs_auth
    ports:
      - "3001:3001"
    command: sh -c "cd /app/backend && pnpm prisma:push && cd /app && pnpm --filter backend dev"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  frontend:
    build:
      context: .
      target: dev
    container_name: volta-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - CI=true
      - NEXT_TELEMETRY_DISABLED=1
      - PNPM_CONFIG_STORE_DIR=/home/volta/.local/share/pnpm/store
      - DATABASE_URL=postgresql://${POSTGRES_USER:-volta_user}:${POSTGRES_PASSWORD:-volta_password}@db:5432/${POSTGRES_DB:-volta_db}?schema=public
      - BACKEND_INTERNAL_URL=http://backend:3001
      - AUTH_TRUST_HOST=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/backend/node_modules
    ports:
      - "3000:3000"
    command: sh -c "pnpm --filter frontend dev"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M

volumes:
  postgres_data:
  redis_data:
  wwebjs-auth:
