services:
  db:
    image: postgres:15
    container_name: volta-db
    restart: always
    environment:
      POSTGRES_USER: volta_user
      POSTGRES_PASSWORD: volta_password
      POSTGRES_DB: volta_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: volta-backend
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://volta_user:volta_password@db:5432/volta_db?schema=public
      - PORT=3001
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/backend/node_modules
      - wwebjs-auth:/app/.wwebjs_auth
    ports:
      - "3001:3001"
    command: sh -c "cd /app/backend && npx prisma migrate deploy && cd /app && npm run dev --workspace=backend"

  frontend:
    build: .
    container_name: volta-frontend
    restart: always
    depends_on:
      - db
      - backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://volta_user:volta_password@db:5432/volta_db?schema=public
      - BACKEND_INTERNAL_URL=http://backend:3001
      # AUTH_TRUST_HOST tells NextAuth (Auth.js v5) to trust the X-Forwarded-Host
      # header set by Cloudflare Tunnel / any reverse proxy, avoiding redirect loops.
      - AUTH_TRUST_HOST=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/backend/node_modules
    ports:
      - "3000:3000"
    command: npm run dev --workspace=frontend

volumes:
  postgres_data:
  wwebjs-auth:
