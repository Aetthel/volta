# Redis production configuration for Volta

# Networking & Security
bind 0.0.0.0
port 6379
protected-mode yes

# Persistence (AOF + RDB for max durability)
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory Limits & Eviction Policy
# Set limit appropriate for your host resources
maxmemory 512mb
# Use 'noeviction' for BullMQ queue stability (prevents dropping jobs when RAM is full)
maxmemory-policy noeviction

# Logging & Connections
loglevel notice
timeout 300
tcp-keepalive 300
